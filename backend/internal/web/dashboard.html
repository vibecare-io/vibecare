<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeCare Scheduler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        dark: '#0f172a',
                        darker: '#020617'
                    }
                }
            }
        }
    </script>
    <style>
        .glass {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }
        .stat-card {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(99, 102, 241, 0.05) 100%);
        }
    </style>
</head>
<body class="bg-darker text-gray-100 min-h-screen">
    <!-- Navbar -->
    <nav class="glass border-b border-primary/20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-8">
                    <h1 class="text-xl font-bold text-primary">VibeCare</h1>
                    <a href="/status" class="text-primary font-semibold border-b-2 border-primary pb-1">Scheduler</a>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="lastUpdate" class="text-sm text-gray-400"></span>
                    <button onclick="fetchStatus()" class="px-4 py-2 bg-primary/20 hover:bg-primary/30 rounded-lg transition-all duration-200 text-sm font-medium border border-primary/30">
                        Refresh
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="stat-card glass rounded-xl p-6 border border-primary/20">
                <div class="text-gray-400 text-sm font-medium mb-2">Total Schedules</div>
                <div id="totalSchedules" class="text-3xl font-bold text-white">0</div>
            </div>
            <div class="stat-card glass rounded-xl p-6 border border-green-500/20">
                <div class="text-gray-400 text-sm font-medium mb-2">Active</div>
                <div id="activeSchedules" class="text-3xl font-bold text-green-400">0</div>
            </div>
            <div class="stat-card glass rounded-xl p-6 border border-yellow-500/20">
                <div class="text-gray-400 text-sm font-medium mb-2">Paused</div>
                <div id="pausedSchedules" class="text-3xl font-bold text-yellow-400">0</div>
            </div>
            <div class="stat-card glass rounded-xl p-6 border border-primary/20">
                <div class="text-gray-400 text-sm font-medium mb-2">Next Upcoming</div>
                <div id="nextUpcoming" class="text-sm font-semibold text-white truncate">-</div>
                <div id="nextUpcomingTime" class="text-xs text-gray-400 mt-1">-</div>
            </div>
        </div>

        <!-- Schedules Table -->
        <div class="glass rounded-xl border border-primary/20 overflow-hidden">
            <div class="px-6 py-4 border-b border-primary/20">
                <h2 class="text-lg font-semibold text-white">Schedules</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-dark/50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Name</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Routine</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Last Execution</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Next Execution</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Status</th>
                        </tr>
                    </thead>
                    <tbody id="schedulesTable" class="divide-y divide-primary/10">
                        <tr>
                            <td colspan="5" class="px-6 py-8 text-center text-gray-500">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let autoRefreshInterval;

        function formatTime(timestamp) {
            if (!timestamp) return '-';
            const date = new Date(timestamp);
            return date.toLocaleString('en-US', {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function formatRelativeTime(timestamp) {
            if (!timestamp) return '-';
            const date = new Date(timestamp);
            const now = new Date();
            const diff = date - now;
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);

            if (diff < 0) return 'Past due';
            if (minutes < 60) return `in ${minutes}m`;
            if (hours < 24) return `in ${hours}h`;
            return `in ${days}d`;
        }

        async function fetchStatus() {
            try {
                const response = await fetch('/api/scheduler/status');
                if (!response.ok) throw new Error('Failed to fetch status');

                const data = await response.json();
                updateDashboard(data);

                document.getElementById('lastUpdate').textContent =
                    `Updated: ${formatTime(data.updated_at)}`;
            } catch (error) {
                console.error('Error fetching status:', error);
                document.getElementById('schedulesTable').innerHTML = `
                    <tr>
                        <td colspan="5" class="px-6 py-8 text-center text-red-400">
                            Error loading schedules: ${error.message}
                        </td>
                    </tr>
                `;
            }
        }

        function updateDashboard(data) {
            // Update stats
            document.getElementById('totalSchedules').textContent = data.stats.total;
            document.getElementById('activeSchedules').textContent = data.stats.active;
            document.getElementById('pausedSchedules').textContent = data.stats.paused;

            if (data.stats.next_upcoming) {
                document.getElementById('nextUpcoming').textContent = data.stats.next_upcoming.name;
                document.getElementById('nextUpcomingTime').textContent =
                    formatRelativeTime(data.stats.next_upcoming.next_execution);
            } else {
                document.getElementById('nextUpcoming').textContent = 'None';
                document.getElementById('nextUpcomingTime').textContent = '-';
            }

            // Update table with grouping by profile
            const tbody = document.getElementById('schedulesTable');
            if (data.schedules.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="px-6 py-8 text-center text-gray-500">
                            No schedules found
                        </td>
                    </tr>
                `;
                return;
            }

            // Group schedules by profile
            const groupedSchedules = {};
            data.schedules.forEach(schedule => {
                const profileKey = schedule.profile_id || 'unknown';
                if (!groupedSchedules[profileKey]) {
                    groupedSchedules[profileKey] = {
                        name: schedule.profile_name || 'Unknown',
                        schedules: []
                    };
                }
                groupedSchedules[profileKey].schedules.push(schedule);
            });

            // Build table HTML with profile groups
            let html = '';
            Object.keys(groupedSchedules).forEach(profileId => {
                const group = groupedSchedules[profileId];

                // Profile header row
                html += `
                    <tr class="bg-primary/10 border-l-4 border-primary">
                        <td colspan="5" class="px-6 py-3">
                            <div class="flex items-center space-x-3">
                                <div class="w-2 h-2 rounded-full bg-primary"></div>
                                <span class="font-semibold text-white">${group.name}</span>
                                <span class="text-xs text-gray-400">(${group.schedules.length} schedule${group.schedules.length !== 1 ? 's' : ''})</span>
                            </div>
                        </td>
                    </tr>
                `;

                // Schedule rows for this profile
                group.schedules.forEach(schedule => {
                    html += `
                        <tr class="hover:bg-dark/30 transition-colors">
                            <td class="px-6 py-4 pl-12">
                                <div class="font-medium text-white">${schedule.name}</div>
                                <div class="text-xs text-gray-500 font-mono">${schedule.id.substring(0, 8)}</div>
                            </td>
                            <td class="px-6 py-4 text-sm text-gray-300">${schedule.routine_name}</td>
                            <td class="px-6 py-4 text-sm text-gray-400">
                                ${formatTime(schedule.last_execution)}
                            </td>
                            <td class="px-6 py-4 text-sm">
                                ${schedule.next_execution
                                    ? `<span class="text-primary">${formatTime(schedule.next_execution)}</span>
                                       <span class="text-xs text-gray-500 ml-2">${formatRelativeTime(schedule.next_execution)}</span>`
                                    : '<span class="text-gray-500">-</span>'
                                }
                            </td>
                            <td class="px-6 py-4">
                                <span class="px-3 py-1 rounded-full text-xs font-semibold ${
                                    schedule.enabled
                                        ? 'bg-green-500/20 text-green-400 border border-green-500/30'
                                        : 'bg-gray-500/20 text-gray-400 border border-gray-500/30'
                                }">
                                    ${schedule.enabled ? 'Active' : 'Paused'}
                                </span>
                            </td>
                        </tr>
                    `;
                });
            });

            tbody.innerHTML = html;
        }

        // Initial fetch
        fetchStatus();

        // Auto-refresh every 30 seconds
        autoRefreshInterval = setInterval(fetchStatus, 30000);

        // Clear interval on page unload
        window.addEventListener('beforeunload', () => {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
        });
    </script>
</body>
</html>
