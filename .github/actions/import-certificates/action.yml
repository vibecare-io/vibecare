name: Import Code Signing Certificates
description: Create keychain and import Apple Developer certificates
inputs:
  certificate-app-base64:
    description: Base64-encoded Developer ID Application certificate
    required: true
  certificate-installer-base64:
    description: Base64-encoded Developer ID Installer certificate
    required: false
    default: ''
  certificate-password:
    description: Password for certificate files
    required: true
outputs:
  keychain-path:
    description: Path to created keychain
    value: ${{ steps.extract-identities.outputs.keychain-path }}
  app-identity:
    description: Developer ID Application identity
    value: ${{ steps.extract-identities.outputs.app-identity }}
  installer-identity:
    description: Developer ID Installer identity
    value: ${{ steps.extract-identities.outputs.installer-identity }}
runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        CERT_APP_BASE64: ${{ inputs.certificate-app-base64 }}
        CERT_PASSWORD: ${{ inputs.certificate-password }}
      run: |
        if [ -z "$CERT_APP_BASE64" ]; then
          echo "::error::Application certificate not provided"
          exit 1
        fi

        if [ -z "$CERT_PASSWORD" ]; then
          echo "::error::Certificate password not provided"
          exit 1
        fi

        echo "✓ Inputs validated successfully"

    - name: Create temporary keychain
      id: create-keychain
      shell: bash
      run: |
        KEYCHAIN_PATH="${RUNNER_TEMP:-$GITHUB_WORKSPACE}/build.keychain"
        KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

        echo "Creating keychain at: $KEYCHAIN_PATH"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        # Save for next steps
        echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
        echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV

        echo "✓ Keychain created successfully"

    - name: Configure keychain
      shell: bash
      run: |
        echo "Configuring keychain: $KEYCHAIN_PATH"

        # Set timeout to 6 hours
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"

        # Unlock keychain
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        # Make it the default keychain
        security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
        security default-keychain -s "$KEYCHAIN_PATH"

        echo "✓ Keychain configured successfully"

    - name: Import Application certificate
      shell: bash
      env:
        CERT_APP_BASE64: ${{ inputs.certificate-app-base64 }}
        CERT_PASSWORD: ${{ inputs.certificate-password }}
      run: |
        echo "Importing Developer ID Application certificate..."

        # Decode certificate
        echo "$CERT_APP_BASE64" | base64 --decode > cert_app.p12

        # Import into keychain
        security import cert_app.p12 \
          -k "$KEYCHAIN_PATH" \
          -P "$CERT_PASSWORD" \
          -T /usr/bin/codesign \
          -T /usr/bin/security

        # Clean up
        rm cert_app.p12

        echo "✓ Application certificate imported successfully"

    - name: Import Installer certificate
      if: inputs.certificate-installer-base64 != ''
      shell: bash
      env:
        CERT_INSTALLER_BASE64: ${{ inputs.certificate-installer-base64 }}
        CERT_PASSWORD: ${{ inputs.certificate-password }}
      run: |
        echo "Importing Developer ID Installer certificate..."

        # Decode certificate
        echo "$CERT_INSTALLER_BASE64" | base64 --decode > cert_installer.p12

        # Import into keychain
        security import cert_installer.p12 \
          -k "$KEYCHAIN_PATH" \
          -P "$CERT_PASSWORD" \
          -T /usr/bin/productsign \
          -T /usr/bin/productbuild \
          -T /usr/bin/security

        # Clean up
        rm cert_installer.p12

        echo "✓ Installer certificate imported successfully"

    - name: Set keychain permissions
      shell: bash
      run: |
        echo "Setting keychain access permissions..."

        security set-key-partition-list \
          -S apple-tool:,apple:,codesign:,productsign: \
          -s \
          -k "$KEYCHAIN_PASSWORD" \
          "$KEYCHAIN_PATH"

        echo "✓ Keychain permissions set successfully"

    - name: Extract signing identities
      id: extract-identities
      shell: bash
      run: |
        echo "Extracting signing identities..."

        # Find Application identity
        APP_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | \
          grep "Developer ID Application" | head -1 | awk '{print $2}')

        # Find Installer identity (may be empty)
        INSTALLER_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" | \
          grep "Developer ID Installer" | head -1 | awk '{print $2}' || true)

        # Validate Application identity exists
        if [ -z "$APP_IDENTITY" ]; then
          echo "::error::No Developer ID Application identity found after import"
          echo "Available identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          exit 1
        fi

        echo "✓ Found Application Identity: $APP_IDENTITY"
        if [ -n "$INSTALLER_IDENTITY" ]; then
          echo "✓ Found Installer Identity: $INSTALLER_IDENTITY"
        else
          echo "⚠ No Installer Identity found (may not be needed)"
        fi

        # Set outputs
        echo "keychain-path=$KEYCHAIN_PATH" >> $GITHUB_OUTPUT
        echo "app-identity=$APP_IDENTITY" >> $GITHUB_OUTPUT
        echo "installer-identity=$INSTALLER_IDENTITY" >> $GITHUB_OUTPUT

        # Show all available identities for debugging
        echo "Available signing identities:"
        security find-identity -v -p codesigning "$KEYCHAIN_PATH"