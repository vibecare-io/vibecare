name: Sign Plugins
description: Sign every plugin executable embedded in an app bundle, inside-out
inputs:
  bundle-path:
    description: Path to the app bundle containing Contents/Resources/plugins
    required: true
  identity:
    description: Signing identity (SHA-1 hash)
    required: true
runs:
  using: composite
  steps:
    - name: Sign embedded plugin executables
      shell: bash
      env:
        BUNDLE_PATH: ${{ inputs.bundle-path }}
        IDENTITY: ${{ inputs.identity }}
      run: |
        set -euo pipefail

        if [ -z "$IDENTITY" ]; then
          echo "Error: No signing identity provided" >&2
          exit 1
        fi

        PLUGINS="${BUNDLE_PATH}/Contents/Resources/plugins"
        if [ ! -d "$PLUGINS" ]; then
          echo "Error: no embedded plugins at $PLUGINS" >&2
          echo "       embed-plugins.sh must run before this action." >&2
          exit 1
        fi

        ENTDIR=".github/scripts/plugin-entitlements"

        # Validate every entitlements file with a STRICT parser first.
        #
        # codesign hands these to AMFIUnserializeXML, which is far less
        # forgiving than the CoreFoundation parser behind `plutil -lint` — and
        # when it refuses, it says only "syntax error near line N". The
        # v0.8.16.26 release died that way: a `--` inside an XML comment, which
        # the spec forbids and plutil happily accepted. xmllint agrees with
        # AMFI and says which rule was broken, so check here and fail readably
        # rather than mid-signing.
        if [ -d "$ENTDIR" ]; then
          for f in "$ENTDIR"/*.entitlements; do
            [ -f "$f" ] || continue
            if ! xmllint --noout "$f"; then
              echo "Error: $f is not valid XML; codesign will reject it" >&2
              exit 1
            fi
          done
        fi

        # Signing must go inside-out: each nested executable first, the app
        # bundle last. The outer signature then seals children that are
        # already valid. Done the other way round, re-signing the app
        # invalidates nothing but leaves the plugins unsigned, and the
        # bundle's own seal breaks the moment they are signed afterwards.
        #
        # Find real Mach-O executables rather than assuming paths: Go plugins
        # keep their binary beside the manifest, Swift plugins stage theirs
        # into dist/, and the SwiftPM .bundle directories beside them hold
        # only resources and must NOT be signed as code.
        #
        # Deepest path first, so anything nested is signed before whatever
        # contains it.
        signed=0
        while IFS= read -r bin; do
          id="$(basename "$(dirname "$bin")")"
          [ "$id" = "dist" ] && id="$(basename "$(dirname "$(dirname "$bin")")")"

          # Per-plugin entitlements, by convention rather than a hard-coded
          # list: drop <id>.entitlements in .github/scripts/plugin-entitlements/
          # and it is picked up with no change here. vision needs
          # com.apple.security.device.camera because the hardened runtime
          # denies capture without it — and denies it silently, which reads
          # as "the camera plugin is broken" rather than as a signing problem.
          ents="$ENTDIR/${id}.entitlements"
          entflags=()
          if [ -f "$ents" ]; then
            entflags=(--entitlements "$ents")
            used_ents="${used_ents-} ${id}"
            echo "  using entitlements $ents"
          fi

          echo "Signing plugin executable: $bin (plugin: $id)"
          # No --deep: this signs one Mach-O file, deliberately. --deep on a
          # plugin directory would try to treat it as a bundle, and for
          # vision that is the failure mode documented in
          # just build-vision-plugin — codesign resolves the directory as a
          # flat bundle and AMFI SIGKILLs the process at spawn while
          # `codesign --verify` still calls the file valid.
          # ${entflags[@]+"${entflags[@]}"}, NOT "${entflags[@]}". macOS ships
          # bash 3.2, and that is what `shell: bash` resolves to on a runner.
          # Before 4.4, expanding an EMPTY array under `set -u` counts as an
          # unbound variable and aborts the script. Every plugin without an
          # entitlements file has an empty entflags, so this killed signing at
          # the first one of those, while vision — the only plugin WITH a file
          # — signed cleanly just before it. The `+` form expands to nothing
          # when unset and works on both 3.2 and 5.x.
          /usr/bin/codesign --force --sign "$IDENTITY" \
            --options runtime \
            --timestamp \
            ${entflags[@]+"${entflags[@]}"} \
            "$bin"

          codesign --verify --strict --verbose=2 "$bin"

          # Read the entitlements back off the binary. A signature that
          # succeeded without them is the dangerous case: vision would ship
          # with the hardened runtime and no camera entitlement, and the
          # runtime denies capture SILENTLY — surfacing as a dead camera on a
          # user's machine rather than as a red build here.
          if [ -f "$ents" ]; then
            if ! codesign -d --entitlements - --xml "$bin" 2>/dev/null \
                 | grep -q "com.apple.security"; then
              echo "Error: $id was signed but carries no entitlements" >&2
              exit 1
            fi
            echo "  ✓ entitlements verified on $id"
          fi

          signed=$((signed + 1))
        done < <(
          find "$PLUGINS" -type f -perm -u+x -exec sh -c \
            'file -b "$1" | grep -q "Mach-O" && echo "$1"' _ {} \; \
          | awk -F/ '{print NF"\t"$0}' | sort -rn | cut -f2-
        )

        if [ "$signed" -eq 0 ]; then
          echo "Error: found no plugin executables to sign under $PLUGINS" >&2
          exit 1
        fi

        # Every entitlements file must have matched a plugin. Because the
        # mapping is by filename, a typo or a plugin rename would otherwise
        # skip the entitlements in complete silence — the build stays green
        # and the camera dies in production.
        if [ -d "$ENTDIR" ]; then
          for f in "$ENTDIR"/*.entitlements; do
            [ -f "$f" ] || continue
            want="$(basename "$f" .entitlements)"
            case " ${used_ents-} " in
              *" $want "*) ;;
              *)
                echo "Error: $f matched no signed plugin" >&2
                echo "       Expected a plugin with id '$want'. Renamed or misspelled?" >&2
                exit 1 ;;
            esac
          done
        fi

        echo "✓ Signed $signed plugin executable(s)"
