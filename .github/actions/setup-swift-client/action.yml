name: Setup Swift Client Environment
description: Setup Swift, install dependencies, and generate protobuf
inputs:
  proto-target:
    description: Protobuf generation target
    required: false
    default: 'client-macos'
runs:
  using: composite
  steps:
    # Use Xcode's bundled Swift toolchain, which matches the runner's SDK.
    # Do NOT install a standalone toolchain (e.g. swift-actions/setup-swift):
    # it shadows Xcode's swift and, when its version drifts from the runner's
    # Xcode SDK, `swift build` fails with "this SDK is not supported by the
    # compiler / failed to build module 'Darwin'".
    - name: Show Swift toolchain
      shell: bash
      run: |
        xcode-select -p
        swift --version

    - name: Cache Swift build
      uses: actions/cache@v4
      with:
        path: |
          clients/macos-swift/VibeCare/.build
          ~/Library/Caches/org.swift.swiftpm
          ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-swift-build-${{ hashFiles('clients/macos-swift/VibeCare/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-swift-build-

    # NOTE: We deliberately do NOT regenerate the protobuf/gRPC stubs in CI.
    # `VCStubs/` is committed and generated against the pinned grpc-swift-2
    # runtime (Package.resolved). Regenerating here used `brew install
    # grpc-swift`, whose protoc-gen-grpc-swift version drifts from the pinned
    # runtime and emits mismatched code — e.g. `MethodDescriptor(…, type:)`,
    # which the pinned GRPCCore rejects ("extra argument 'type' in call").
    # The committed stubs already compile against the pinned runtime (this is
    # exactly what `just swift-build` does locally), so we build them as-is.
    # To update stubs, run `just proto-gen` locally and commit VCStubs/.