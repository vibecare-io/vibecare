name: Release 🎉

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true

env:
  GO_VERSION: '1.24'

jobs:
  build-backend:
    name: Build Go Backend
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        uses: ./.github/actions/setup-version
        with:
          event-name: ${{ github.event_name }}
          manual-version: ${{ github.event.inputs.version }}

      - name: Setup Go backend environment
        uses: ./.github/actions/setup-go-backend
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Import certificates
        id: certs
        uses: ./.github/actions/import-certificates
        with:
          certificate-app-base64: ${{ secrets.APPLE_CERTIFICATE_APP_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERT_PASSWORD }}

      - name: Build universal binary
        run: |
          cd backend
          ./../.github/scripts/build-universal-binary.sh \
            "${{ steps.version.outputs.version }}" \
            "../vibecare-server" \
            "cmd/server/main.go"

      - name: Sign backend binary
        uses: ./.github/actions/sign-binary
        with:
          binary-path: vibecare-server
          identity: ${{ steps.certs.outputs.app-identity }}

      - name: Tar backend binary (preserve permissions)
        run: tar -cvf backend-binary.tar vibecare-server

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: backend-binary.tar
          retention-days: 1

  # Just the client binary. Bundle creation, embedding and signing all moved
  # to assemble-app: while this job also assembled the bundle it had to wait
  # for the backend, which serialised three builds that share nothing but
  # their output directory.
  build-macos-client:
    name: Build macOS Swift Client
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Swift client environment
        uses: ./.github/actions/setup-swift-client

      - name: Build Swift client
        run: |
          cd clients/macos-swift/VibeCare
          swift build -c release --product VibeCare --jobs $(sysctl -n hw.ncpu)
          cp .build/release/VibeCare ../../../vibecare-client
          chmod +x ../../../vibecare-client

      - name: Tar client binary (preserve permissions)
        run: tar -cvf client-binary.tar vibecare-client

      - name: Upload client binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-binary
          path: client-binary.tar
          retention-days: 1

  # One job per plugin, in parallel. Plugins are where every feature actually
  # lives, so a release without them installs cleanly and does nothing.
  #
  # The stack is declared per plugin rather than inferred, because the two
  # differ in what they need and neither need is guessable from the directory:
  #
  #   * go    — needs protoc and a proto-gen run, not merely a Go toolchain.
  #     backend/pkg/proto/ is generated and NOT committed, and plugins/todo
  #     has `replace ... => ../../backend`, so its build reaches straight into
  #     stubs that do not exist until setup-go-backend has run.
  #   * swift — needs nothing but the runner's Xcode toolchain. These plugins'
  #     stubs ARE committed (sdk/swift/VCPluginSDK/Sources/VCKStubs), so no
  #     generation step applies.
  #
  # Adding a plugin means adding a row here. Forgetting to is caught at
  # assembly, which fails when fewer plugins are embedded than the repo has
  # manifests — silently shipping without one is the bug this all fixes.
  build-plugin:
    name: Build Plugin (${{ matrix.id }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: todo, stack: go }
          - { id: vision, stack: swift }
          - { id: vibecheck, stack: swift }
          - { id: postures, stack: swift }
          - { id: blink-jump, stack: swift }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go backend environment
        if: matrix.stack == 'go'
        uses: ./.github/actions/setup-go-backend
        with:
          go-version: ${{ env.GO_VERSION }}

      # Per-plugin SwiftPM cache. Deliberately not setup-swift-client, whose
      # cache is keyed to the client's Package.resolved and would thrash
      # against five unrelated dependency graphs.
      - name: Cache SwiftPM build
        if: matrix.stack == 'swift'
        uses: actions/cache@v4
        with:
          path: |
            plugins/${{ matrix.id }}/.build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-plugin-${{ matrix.id }}-${{ hashFiles(format('plugins/{0}/Package.resolved', matrix.id)) }}
          restore-keys: |
            ${{ runner.os }}-plugin-${{ matrix.id }}-

      - name: Install just
        uses: extractions/setup-just@v3

      # Via just, not inline: the Justfile is the single definition of every
      # plugin's build, and some have subtleties that fail SILENTLY when
      # guessed — vision's -sectcreate Info.plist and the signature that seals
      # it, and the staged dist/ layout that stops codesign resolving a plugin
      # directory as a flat bundle.
      - name: Build plugin
        run: just build-${{ matrix.id }}-plugin

      # Ship the plugin directory minus its build tree. assemble-app extracts
      # these and hands the result to embed-plugins.sh, so the per-plugin
      # layout rules (dist/ as dist/, resource bundle beside the binary) stay
      # defined in exactly one place rather than being re-encoded here.
      - name: Tar plugin (preserve permissions)
        run: tar -cvf plugin-${{ matrix.id }}.tar --exclude='.build' -C plugins ${{ matrix.id }}

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.id }}
          path: plugin-${{ matrix.id }}.tar
          retention-days: 1

  # Everything signed happens here, in one job with one certificate import,
  # so the inside-out order is visible in a single file: plugins first, then
  # the bundle. (The server arrives already signed from build-backend; the
  # bundle's signature seals it rather than re-signing it.)
  assemble-app:
    name: Assemble and Sign App Bundle
    runs-on: macos-latest
    needs: [build-backend, build-macos-client, build-plugin]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        uses: ./.github/actions/setup-version
        with:
          event-name: ${{ github.event_name }}
          manual-version: ${{ github.event.inputs.version }}

      - name: Import certificates
        id: certs
        uses: ./.github/actions/import-certificates
        with:
          certificate-app-base64: ${{ secrets.APPLE_CERTIFICATE_APP_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERT_PASSWORD }}

      - name: Download client binary
        uses: actions/download-artifact@v4
        with:
          name: client-binary
          path: .

      - name: Download backend binary
        uses: actions/download-artifact@v4
        with:
          name: backend-binary
          path: .

      - name: Download plugin artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          merge-multiple: true
          path: plugin-tars

      - name: Create app bundle
        run: |
          tar -xvf client-binary.tar
          ./.github/scripts/create-app-bundle.sh \
            "VibeCare" \
            "vibecare-client" \
            "${{ steps.version.outputs.version }}" \
            "io.vibecare.app"

      - name: Embed server + LaunchAgent into app bundle
        run: |
          tar -xvf backend-binary.tar
          mkdir -p VibeCare.app/Contents/Resources VibeCare.app/Contents/Library/LaunchAgents
          cp vibecare-server VibeCare.app/Contents/Resources/vibecare-server
          chmod +x VibeCare.app/Contents/Resources/vibecare-server
          cp .github/scripts/io.vibecare.server.plist \
             VibeCare.app/Contents/Library/LaunchAgents/io.vibecare.server.plist

      # Into a clean directory, NOT over the checked-out plugins/. Extracting
      # over the source tree would leave a failed plugin's manifest in place
      # with no binary beside it, which is exactly the state the expected-count
      # check below exists to catch.
      - name: Unpack built plugins
        run: |
          mkdir -p built-plugins
          for t in plugin-tars/*.tar; do
            echo "unpacking $t"
            tar -xf "$t" -C built-plugins
          done
          ls -la built-plugins

      # Third argument is how many plugins the repo declares. Fewer embedded
      # than that fails the release rather than shipping an app quietly
      # missing a feature.
      - name: Embed plugins into app bundle
        run: |
          expected=$(ls -d plugins/*/manifest.yaml 2>/dev/null | wc -l | tr -d ' ')
          ./.github/scripts/embed-plugins.sh VibeCare.app built-plugins "$expected"

      # Inside-out: every plugin executable first, the app bundle last, so the
      # bundle's signature seals children that are already valid.
      - name: Sign embedded plugins
        uses: ./.github/actions/sign-plugins
        with:
          bundle-path: VibeCare.app
          identity: ${{ steps.certs.outputs.app-identity }}

      - name: Sign app bundle
        uses: ./.github/actions/sign-app-bundle
        with:
          bundle-path: VibeCare.app
          entitlements-path: clients/macos-swift/VibeCare/vibecare/vibecare.entitlements
          identity: ${{ steps.certs.outputs.app-identity }}

      - name: Tar app bundle (preserve permissions)
        run: tar -cvf macos-client-app.tar VibeCare.app

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-client-app
          path: macos-client-app.tar
          retention-days: 1

  create-release:
    name: Create Release Package
    runs-on: macos-latest
    needs: [assemble-app]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        uses: ./.github/actions/setup-version
        with:
          event-name: ${{ github.event_name }}
          manual-version: ${{ github.event.inputs.version }}

      - name: Download client artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-client-app
          path: .

      - name: Extract app bundle
        run: |
          tar -xvf macos-client-app.tar
          mkdir -p dist
          mv VibeCare.app dist/

      - name: Import certificates
        id: certs
        uses: ./.github/actions/import-certificates
        with:
          certificate-app-base64: ${{ secrets.APPLE_CERTIFICATE_APP_BASE64 }}
          certificate-installer-base64: ${{ secrets.APPLE_CERTIFICATE_INSTALLER_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERT_PASSWORD }}

      - name: Create tarball
        run: |
          mkdir -p build
          cd dist
          tar -czf ../build/vibecare-${{ steps.version.outputs.version }}-macos.tar.gz VibeCare.app
          cd ..
          shasum -a 256 build/vibecare-${{ steps.version.outputs.version }}-macos.tar.gz \
            > build/vibecare-${{ steps.version.outputs.version }}-macos.tar.gz.sha256

      # PKG installer + notarization are intentionally skipped: notarization
      # requires an in-effect Apple Developer agreement (currently blocked with
      # "A required agreement is missing or has expired"). We ship the signed
      # (Developer ID, not notarized) app + server as a tarball; the Homebrew
      # cask installs it and clears the quarantine flag so Gatekeeper allows
      # first launch. Restore the notarized .pkg once the Apple agreement is
      # accepted (re-add create-pkg-installer.sh + notarize-pkg.sh here and the
      # .pkg entries to the release files below).

      - name: Generate release notes
        run: |
          ./.github/scripts/generate-release-notes.sh \
            "${{ steps.version.outputs.version }}" \
            "release_notes.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: VibeCare ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            build/vibecare-${{ steps.version.outputs.version }}-macos.tar.gz
            build/vibecare-${{ steps.version.outputs.version }}-macos.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vibecare-${{ steps.version.outputs.version }}-macos
          path: |
            build/*.pkg
            build/*.tar.gz
            build/*.sha256
          retention-days: 30
  update-homebrew-tap:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        uses: ./.github/actions/setup-version
        with:
          event-name: ${{ github.event_name }}
          manual-version: ${{ github.event.inputs.version }}

      - name: Compute tarball checksum
        id: cask
        run: |
          VER="${{ steps.version.outputs.version }}"
          NUM="${VER#v}"
          URL="https://github.com/${{ github.repository }}/releases/download/${VER}/vibecare-${VER}-macos.tar.gz"
          curl -fsSL "$URL" -o tarball.tgz
          SHA="$(sha256sum tarball.tgz | awk '{print $1}')"
          echo "num=$NUM" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: vibecare-io/homebrew-apps
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Write cask
        run: |
          mkdir -p tap/Casks
          cat > tap/Casks/vibecare.rb <<'CASK'
          cask "vibecare" do
            version "${{ steps.cask.outputs.num }}"
            sha256 "${{ steps.cask.outputs.sha }}"

            url "https://github.com/${{ github.repository }}/releases/download/v#{version}/vibecare-v#{version}-macos.tar.gz",
                verified: "github.com/${{ github.repository }}/"
            name "VibeCare"
            desc "Wellness and routine management app with on-device BFRB detection"
            homepage "https://github.com/${{ github.repository }}"

            depends_on macos: :sequoia

            app "VibeCare.app"

            # App is Developer ID signed but not notarized; clear quarantine so
            # Gatekeeper allows first launch.
            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-dr", "com.apple.quarantine", "#{appdir}/VibeCare.app"],
                             sudo: false
              # Best-effort: restart the backend only if its LaunchAgent is
              # already loaded (from a prior app launch). On a fresh install the
              # agent isn't registered yet (the app registers it via SMAppService
              # on first launch), so this must NOT abort the install.
              system_command "/bin/launchctl",
                             args: ["kickstart", "-k", "gui/#{Process.uid}/io.vibecare.server"],
                             sudo: false,
                             must_succeed: false
            end

            caveats <<~EOS
              If VibeCare was previously installed with the .pkg installer, remove that
              copy so Homebrew can manage it (your data in ~/.vibecare is preserved):

                launchctl bootout gui/$(id -u)/io.vibecare.server 2>/dev/null || true
                rm -f ~/Library/LaunchAgents/io.vibecare.server.plist
                sudo rm -rf /Applications/VibeCare.app /usr/local/bin/vibecare-server
                sudo pkgutil --forget io.vibecare.app

              then re-run: brew install --cask vibecare
            EOS

            zap trash: [
              "~/Library/Application Support/VibeCare",
              "~/.vibecare",
              "~/Library/Preferences/io.vibecare.App.vibecare.plist",
              "~/Library/Caches/io.vibecare.App.vibecare",
            ]
          end
          CASK

      - name: Commit and push
        run: |
          cd tap
          if git diff --quiet; then
            echo "Cask already up to date"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/vibecare.rb
          git commit -m "vibecare ${{ steps.version.outputs.version }}"
          git push
