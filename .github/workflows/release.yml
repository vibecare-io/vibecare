name: Release 🎉

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true

env:
  GO_VERSION: '1.24'

jobs:
  build-backend:
    name: Build Go Backend
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        uses: ./.github/actions/setup-version
        with:
          event-name: ${{ github.event_name }}
          manual-version: ${{ github.event.inputs.version }}

      - name: Setup Go backend environment
        uses: ./.github/actions/setup-go-backend
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Import certificates
        id: certs
        uses: ./.github/actions/import-certificates
        with:
          certificate-app-base64: ${{ secrets.APPLE_CERTIFICATE_APP_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERT_PASSWORD }}

      - name: Build universal binary
        run: |
          cd backend
          ./../.github/scripts/build-universal-binary.sh \
            "${{ steps.version.outputs.version }}" \
            "../vibecare-server" \
            "cmd/server/main.go"

      - name: Sign backend binary
        uses: ./.github/actions/sign-binary
        with:
          binary-path: vibecare-server
          identity: ${{ steps.certs.outputs.app-identity }}

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: vibecare-server
          retention-days: 1

  build-macos-client:
    name: Build macOS Swift Client
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        uses: ./.github/actions/setup-version
        with:
          event-name: ${{ github.event_name }}
          manual-version: ${{ github.event.inputs.version }}

      - name: Setup Swift client environment
        uses: ./.github/actions/setup-swift-client

      - name: Import certificates
        id: certs
        uses: ./.github/actions/import-certificates
        with:
          certificate-app-base64: ${{ secrets.APPLE_CERTIFICATE_APP_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERT_PASSWORD }}

      - name: Build Swift client
        run: |
          cd clients/macos-swift/VibeCare
          swift build -c release --product VibeCare --jobs $(sysctl -n hw.ncpu)
          cp .build/release/VibeCare ../../../vibecare-client
          chmod +x ../../../vibecare-client

      - name: Create app bundle
        run: |
          ./.github/scripts/create-app-bundle.sh \
            "VibeCare" \
            "vibecare-client" \
            "${{ steps.version.outputs.version }}" \
            "io.vibecare.app"

      - name: Sign app bundle
        uses: ./.github/actions/sign-app-bundle
        with:
          bundle-path: VibeCare.app
          entitlements-path: clients/macos-swift/VibeCare/vibecare/vibecare.entitlements
          identity: ${{ steps.certs.outputs.app-identity }}

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-client-app
          path: VibeCare.app/
          retention-days: 1

  create-release:
    name: Create Release Package
    runs-on: macos-latest
    needs: [build-backend, build-macos-client]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        uses: ./.github/actions/setup-version
        with:
          event-name: ${{ github.event_name }}
          manual-version: ${{ github.event.inputs.version }}

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-binary
          path: dist/

      - name: Download client artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-client-app
          path: dist/VibeCare.app/

      - name: Import certificates
        id: certs
        uses: ./.github/actions/import-certificates
        with:
          certificate-app-base64: ${{ secrets.APPLE_CERTIFICATE_APP_BASE64 }}
          certificate-installer-base64: ${{ secrets.APPLE_CERTIFICATE_INSTALLER_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERT_PASSWORD }}

      - name: Create tarball
        run: |
          mkdir -p build
          cd dist
          tar -czf ../build/vibecare-${{ steps.version.outputs.version }}-macos.tar.gz \
            vibecare-server VibeCare.app
          cd ..
          shasum -a 256 build/vibecare-${{ steps.version.outputs.version }}-macos.tar.gz \
            > build/vibecare-${{ steps.version.outputs.version }}-macos.tar.gz.sha256

      - name: Create and sign PKG installer
        run: |
          ./.github/scripts/create-pkg-installer.sh \
            "${{ steps.version.outputs.version }}" \
            "${{ steps.certs.outputs.installer-identity }}" \
            "dist/vibecare-server" \
            "dist/VibeCare.app"

      - name: Notarize PKG
        run: |
          ./.github/scripts/notarize-pkg.sh \
            "build/VibeCare-${{ steps.version.outputs.version }}.pkg" \
            "${{ secrets.APPLE_DEVELOPER_ID }}" \
            "${{ secrets.APPLE_APP_PASSWORD }}" \
            "${{ secrets.APPLE_TEAM_ID }}"

      - name: Verify all signatures
        run: |
          ./.github/scripts/verify-signatures.sh \
            "dist/vibecare-server" \
            "dist/VibeCare.app" \
            "build/VibeCare-${{ steps.version.outputs.version }}.pkg"

      - name: Generate release notes
        run: |
          ./.github/scripts/generate-release-notes.sh \
            "${{ steps.version.outputs.version }}" \
            "release_notes.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: VibeCare ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            build/VibeCare-${{ steps.version.outputs.version }}.pkg
            build/VibeCare-${{ steps.version.outputs.version }}.pkg.sha256
            build/vibecare-${{ steps.version.outputs.version }}-macos.tar.gz
            build/vibecare-${{ steps.version.outputs.version }}-macos.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vibecare-${{ steps.version.outputs.version }}-macos
          path: |
            build/*.pkg
            build/*.tar.gz
            build/*.sha256
          retention-days: 30