<svg xmlns="http://www.w3.org/2000/svg" width="220" height="150" viewBox="0 0 220 150" role="img" aria-label="A slouched figure beside an upright one">
  <!--
    The illustration on every posture nudge, referenced RELATIVELY as
    "icons/posture.svg" (PostureMonitor.appearance) and served by API.swift's
    /icons/ route. A plugin cannot know the port core assigned it, so a
    relative path is the only icon reference it can honestly send.

    Self-contained on purpose: no external fonts, no CSS variables, no
    currentColor. The alert panel's background is the client's to choose and
    may be light or dark, so the artwork carries its own rounded plate and
    every stroke is opaque against it.
  -->
  <rect x="4" y="4" width="212" height="142" rx="22" fill="#2e6f6a"/>

  <!-- Left: the slouch. Dimmed, because it is the thing being corrected. -->
  <g stroke="#9fc9c5" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.75">
    <!-- head, forward of the shoulders -->
    <circle cx="52" cy="53" r="13" fill="#9fc9c5" stroke="none"/>
    <!-- spine, curved: head craned forward over a rounded upper back -->
    <path d="M58 66 C50 78 48 90 56 100"/>
    <!-- shoulder line, tilted -->
    <path d="M36 76 L72 70"/>
    <!-- thigh and shin -->
    <path d="M56 100 L86 103"/>
    <path d="M86 103 L88 124"/>
  </g>
  <!-- chair seat and back under the slouch -->
  <g stroke="#1f504c" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M40 104 L92 104"/>
    <path d="M40 104 L38 124"/>
  </g>

  <!-- Right: the target. Full-strength white. -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none">
    <circle cx="150" cy="44" r="13" fill="#ffffff" stroke="none"/>
    <!-- spine, straight and stacked over the hips -->
    <path d="M150 57 L150 100"/>
    <!-- shoulder line, level -->
    <path d="M132 70 L168 70"/>
    <path d="M150 100 L180 100"/>
    <path d="M180 100 L182 122"/>
  </g>
  <g stroke="#1f504c" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M134 101 L186 101"/>
    <path d="M134 101 L132 122"/>
  </g>

  <!-- The correction, drawn as an arrow from the slouch to the upright. -->
  <g stroke="#ffd166" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M100 62 L118 62"/>
    <path d="M112 55 L119 62 L112 69"/>
  </g>
</svg>
