id: postures
name: Postures
icon: figure.stand
exec: ./dist/postures
# Subscribing is only half of it: vision runs a model when demand is non-zero
# AND some live vision.request.v1 names the topic, so postures MUST declare
# vision.request.v1 under `publishes` and keep publishing one. Publishing an
# undeclared topic is a logged error and a dropped message, which here would
# silently mean "vision never runs the model I need".
subscribes: [vision.body_pose.v1, vision.signals.v1]
publishes:  [vision.request.v1]
ui: webview
# No Info.plist, no -sectcreate, no codesign: postures never opens a camera.
build: just build-postures-plugin
